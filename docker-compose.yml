services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: secforum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secforum_password}
      POSTGRES_DB: ${POSTGRES_DB:-secforum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secforum} -d ${POSTGRES_DB:-secforum}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secforum-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secforum-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-secforum}:${POSTGRES_PASSWORD:-secforum_password}@db:5432/${POSTGRES_DB:-secforum}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - secforum-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secforum-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_PORT: 3001
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - secforum-network

networks:
  secforum-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
